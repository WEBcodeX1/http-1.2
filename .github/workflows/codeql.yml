name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 5 * * 1'

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 \
            cmake \
            libboost-all-dev \
            nlohmann-json3-dev \
            libpython3-dev \
            libxerces-c-dev \
            libjpeg-dev \
            libssl-dev

      - name: Select gcc-14/g++-14 as default compiler
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --set c++ /usr/bin/g++-14
          which gcc
          which g++
          which cc
          which c++
          gcc --version | head -n1
          g++ --version | head -n1
          cc --version | head -n1
          c++ --version | head -n1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        env:
          CC: cc
          CXX: c++
        run: |
          cmake -B _build -DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++
          cmake --build _build --parallel $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          upload: never
